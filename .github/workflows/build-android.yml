name: Build Resonance Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/unified-ytmusic-search-v07']
concurrency:
  group: resonance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Compile Rust JNI for Android
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOL/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOL/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOL/x86_64-linux-android26-clang"
          # librespot/rustls uses ring's C assembler: cc-rs needs explicit NDK
          # clang/archiver paths for Android cross-compilation (not host clang).
          export CC_aarch64_linux_android="$TOOL/aarch64-linux-android26-clang"
          export CC_armv7_linux_androideabi="$TOOL/armv7a-linux-androideabi26-clang"
          export CC_x86_64_linux_android="$TOOL/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOL/llvm-ar"
          export AR_armv7_linux_androideabi="$TOOL/llvm-ar"
          export AR_x86_64_linux_android="$TOOL/llvm-ar"
          for pair in "aarch64-linux-android arm64-v8a"; do
            set -- $pair
            cargo build --release --manifest-path rust-core/Cargo.toml --target "$1"
            mkdir -p "app/src/main/jniLibs/$2"
            cp "rust-core/target/$1/release/libresonance_core.so" "app/src/main/jniLibs/$2/"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify Rust core tests
        run: cargo test --manifest-path rust-core/Cargo.toml
      - name: Build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-Android-v0.7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
